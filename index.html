<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Schedule</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<p id="loading" class="loading">Loading your schedule…</p>
<div class="wrap" id="app" hidden>
  <header class="banner">
    <div class="userbar"><span id="whoami"></span><button type="button" class="ghost" id="logoutBtn">Log out</button></div>
    <h1>Weekly Schedule &amp; Tasks</h1>
    <p>Classes, study sessions and to-dos in one place (Monday – Sunday)</p>
  </header>

  <!-- TASKS -->
  <section id="tasks">
    <h2>✅ Tasks</h2>
    <div class="card">
      <form id="taskForm">
        <div class="full"><label>Task</label><input id="tTitle" required placeholder="What needs to be done?"></div>
        <div><label>Due date</label><input id="tDue" type="date"></div>
        <div><label>Priority</label>
          <select id="tPrio"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select></div>
        <div class="full"><button class="primary" type="submit">+ Add task</button></div>
      </form>
    </div>
    <div class="card">
      <div class="filters" id="taskFilters">
        <button data-f="all" class="active">All</button>
        <button data-f="open">Open</button>
        <button data-f="done">Done</button>
      </div>
      <div id="taskList"></div>
    </div>
  </section>

  <!-- SCHEDULES -->
  <section id="schedules">
    <div class="sechead">
      <h2>🗓️ Weekly schedule</h2>
      <button class="primary" type="button" id="dlBtn">⬇ Download PNG</button>
    </div>
    <div class="card">
      <form id="schForm" class="three">
        <div class="full"><label>Class / activity</label><input id="sTitle" required placeholder="e.g. Math, Python practice, Lunch"></div>
        <div><label>Day</label>
          <select id="sDay">
            <option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option>
            <option value="3">Thursday</option><option value="4">Friday</option><option value="5">Saturday</option><option value="6">Sunday</option>
          </select></div>
        <div><label>Start time</label><input id="sStart" type="time" required value="09:00"></div>
        <div><label>End time</label><input id="sEnd" type="time" required value="10:00"></div>
        <div><label>Type</label>
          <select id="sCat">
            <option value="main">Main class</option>
            <option value="study">Study / Project</option>
            <option value="special">Special class</option>
            <option value="break">Break / Meal</option>
          </select></div>
        <div class="span2"><label>Link a task (optional)</label>
          <select id="sTask"><option value="">— none —</option></select></div>
        <div class="full"><label>Room / notes (optional)</label><input id="sNotes" placeholder="Room 204, Teacher name..."></div>
        <div class="full"><button class="primary" type="submit">+ Add to weekly schedule</button></div>
      </form>
    </div>
    <div class="card">
      <div class="gridscroll"><div id="timetable"></div></div>
      <div class="legend">
        <span><i style="background:var(--main)"></i>Main class</span>
        <span><i style="background:var(--study)"></i>Study / Project</span>
        <span><i style="background:var(--special)"></i>Special class</span>
        <span><i style="background:var(--break)"></i>Break / Meal</span>
      </div>
      <div class="hint">Repeats every week. Use ✕ on a block to remove it.</div>
    </div>
  </section>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/state.js"></script>
<script src="js/tasks.js"></script>
<script src="js/schedule.js"></script>
<script src="js/download.js"></script>
<script src="js/app.js"></script>
</body>
</html>
